<style>
:root{--blue:#4B9CD3;--blue-d:#2f7fb8;--navy:#13294B;--sky:#EAF4FB;--ink:#1b2333;--mute:#5d6b82;--line:#dde7f0;--bg:#fbfdff;--ok:#1f8a5b;--warn:#b7791f;--bad:#c0392b;--r:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{width:42px;height:42px}
.brand b{font-family:Fraunces,Georgia,serif;font-size:19px;color:var(--navy);line-height:1.05}
.brand b span{display:block;font-size:12px;font-family:Inter,sans-serif;color:var(--blue-d);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
nav{margin-left:auto;display:flex;gap:4px;align-items:center}
nav a{text-decoration:none;padding:9px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mute);white-space:nowrap}
nav a.on{background:var(--sky);color:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;min-height:44px}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue)}
.btn.sm{padding:8px 14px;min-height:36px;font-size:14px}
.btn.navy{background:var(--navy)}
.btn.red{background:#fff;color:var(--bad);border:1.5px solid #f1c9c4}
.btn.venmo{background:#008CFF;width:100%;margin-top:12px}.btn.venmo:hover{background:#0074d4}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hero{padding:34px 0 14px}
.hero h1{font-family:Fraunces,Georgia,serif;font-size:clamp(28px,5vw,44px);color:var(--navy);margin:0 0 8px;line-height:1.1}
.hero p{margin:0;color:var(--mute);font-size:16px;max-width:620px;line-height:1.5}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{background:var(--sky);color:var(--navy);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.tools{position:sticky;top:64px;z-index:10;background:var(--bg);padding:12px 0 10px}
.search{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:16px;outline:none}
.search:focus{border-color:var(--blue)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--mute)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.mini{padding:5px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:8px 0 40px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{text-decoration:none;display:block;background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(19,41,75,.08)}
.ph{aspect-ratio:3/4;background:linear-gradient(160deg,var(--sky),#d7e9f6);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .none{font-family:Fraunces,serif;color:var(--blue-d);font-size:42px;opacity:.55}
.tag{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.95);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--navy)}
.tag.out{color:var(--warn)}
.card .meta{padding:12px 14px 14px}
.card h3{margin:0 0 4px;font-size:15px;line-height:1.3}
.card .sub{color:var(--mute);font-size:13px}
.card .sub.by{margin-top:3px;color:var(--blue-d);font-weight:600}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.detail{display:grid;gap:24px;padding:24px 0 50px}
@media(min-width:820px){.detail{grid-template-columns:1fr 1fr;gap:40px;align-items:start}}
.detail .ph{border-radius:var(--r);aspect-ratio:4/5}
.detail h1{font-family:Fraunces,Georgia,serif;color:var(--navy);margin:6px 0 10px;font-size:clamp(26px,4vw,36px);line-height:1.15}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.desc{color:var(--mute);line-height:1.6}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:18px}
.box h3{margin:0 0 12px;font-size:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:10px 0 6px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=date],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--mute);margin-top:10px;line-height:1.5}
.msg{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.5}
.msg.err{background:#fdf0ee;color:var(--bad)}
.msg.ok{background:#e9f7f0;color:var(--ok)}
.msg.info{background:var(--sky);color:var(--navy)}
.back{display:inline-block;margin-top:20px;color:var(--mute);text-decoration:none;font-weight:600;font-size:14px}
.page{padding:28px 0 50px}
.page h1{font-family:Fraunces,Georgia,serif;color:var(--navy);margin:0 0 6px;font-size:30px}
.auth{max-width:420px;margin:0 auto}
.list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.item{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;align-items:center}
.item .th{width:64px;height:80px;border-radius:10px;flex-shrink:0;overflow:hidden;background:var(--sky);display:flex;align-items:center;justify-content:center;color:var(--blue-d);font-family:Fraunces,serif;font-size:24px}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:15px}
.item .info small{color:var(--mute);font-size:13px;line-height:1.5;display:block}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.st{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.st.Pending{background:#fff4e0;color:var(--warn)}
.st.Confirmed{background:#e9f7f0;color:var(--ok)}
.st.Returned{background:#eef1f5;color:var(--mute)}
.st.Cancelled{background:#fdf0ee;color:var(--bad)}
.tabs{display:flex;gap:8px;margin:16px 0 4px;overflow-x:auto}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--mute);font-size:13px;text-align:center}
@media(max-width:560px){
 .brand b{font-size:16px}.brand img{width:38px;height:38px}
 nav a{padding:8px 9px;font-size:13px}
 .hide-sm{display:none}
 .item{flex-wrap:wrap}.item .acts{width:100%;justify-content:flex-start}
}
</style>
</head>

<main id="app" class="wrap"></main>
<footer><div class="wrap">Carolina Costume Closet · Rent it, wear it, bring it back. · A student project, not affiliated with UNC.</div></footer>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ====== SETTINGS (safe to be public) ======
const SUPABASE_URL = "https://hpjxihxncnbzcqgxtubw.supabase.co";
const SUPABASE_KEY = "sb_publishable_1r2kjgK4LEdE8XiapCuZjw_839p-dRU";
const PRICE = 10, MAX_COSTUMES = 2, MAX_ACCESSORIES = 1;
const VENMO = "Keokitakeno";
const MAX_DAYS = 7;
const CATEGORIES = ["Halloween","Decades","Theme Party","Group Costume","Animals","Characters","Other"];
const cats = c => (c?.categories?.length ? c.categories : (c?.category && c.category !== "Accessories" ? [c.category] : []));
const SIZES = ["XS","S","M","L","XL","XXL","One Size"];
// ==========================================

const sb = window.__SB__ || createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");
const nav = document.getElementById("nav");
let session = null, profile = null;
const ui = { q: "", cat: "All", type: "All", teamTab: "requests" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initial = n => esc((n || "?").trim()[0] || "?");
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const addDays = (s, n) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
const fmt = d => d ? new Date(d + "T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "";
const photo = (c, cls="") => c?.photo_url ? `<img src="${esc(c.photo_url)}" alt="${esc(c.name)}" loading="lazy">` : `<span class="none ${cls}">🎭</span>`;
const friendly = e => {
  const m = e?.message || String(e);
  if (/membership is not active/i.test(m)) return `Your membership isn't active yet. Venmo the team $${PRICE} for the month and we'll turn it on.`;
  if (/up to 7 days|rental is too long/i.test(m)) return `Rentals are ${MAX_DAYS} days max. Pick an earlier return date.`;
  if (/already have/i.test(m)) return m + " Return one first, then you can request another.";
  if (/Invalid login/i.test(m)) return "Wrong email or password.";
  if (/row-level security/i.test(m)) return "You don't have permission to do that.";
  return m;
};

const isActive = p => !!p && (p.is_team || (p.active && (!p.active_until || new Date(p.active_until) > new Date())));
function timeLeft(p){
  if (p.is_team) return "Team · lifetime";
  if (!p.active || !p.active_until) return "Not active";
  const d = Math.ceil((new Date(p.active_until) - Date.now()) / 86400000);
  return d > 0 ? `${d} day${d === 1 ? "" : "s"} left` : "Expired";
}
const digits = s => String(s || "").replace(/[^\d+]/g, "");
async function teamList(){
  const { data } = await sb.from("profiles").select("id, name, email, phone").eq("is_team", true).order("name");
  return data || [];
}
let listers = null;
async function loadListers(){
  if (listers) return listers;
  const { data } = await sb.rpc("team_names");
  listers = Object.fromEntries((data || []).map(p => [p.id, p.name]));
  return listers;
}
const listedBy = c => (listers && c?.listed_by && listers[c.listed_by]) ? listers[c.listed_by].split(" ")[0] : "";
function payBox(){
  const note = encodeURIComponent("Carolina Costume Closet membership - " + (session?.user?.email || ""));
  const url = `https://venmo.com/${VENMO}?txn=pay&amount=${PRICE}&note=${note}`;
  return `<div class="msg info">Your membership isn't active yet. Pay $${PRICE} for the month on Venmo and we'll switch you on, usually the same day.
    <a class="btn venmo" href="${url}" target="_blank" rel="noopener">Pay $${PRICE} on Venmo</a>
    <span class="note" style="display:block;margin-top:8px">Venmo: @${VENMO}. Your email is already in the payment note so we know it's you.</span></div>`;
}

async function loadProfile(){
  profile = null;
  if (!session) return;
  const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  profile = data;
}

function drawNav(route){
  const on = r => route === r ? "on" : "";
  nav.innerHTML = `
    <a href="#/" class="${on("browse")}">Browse</a>
    ${session ? `<a href="#/rentals" class="${on("rentals")}">My Rentals</a>` : ""}
    ${profile?.is_team ? `<a href="#/team" class="${on("team")}">Team</a>` : ""}
    ${session ? `<a href="#/out" title="${esc(session.user.email)}">Sign out</a>` : `<a href="#/login" class="${on("login")}">Sign in</a>`}`;
}

function loading(){ app.innerHTML = `<div class="empty">Loading…</div>`; }

// ---------- BROWSE ----------
let costumesCache = [];
async function browse(){
  app.innerHTML = `
    <section class="hero">
      <h1>Rent the costume.<br>Skip the one-time buy.</h1>
      <p>Theme party this weekend? Borrow from our closet instead of buying something you'll wear once.</p>
      <div class="pills"><span class="pill">$${PRICE}/month</span><span class="pill">${MAX_COSTUMES} costumes + ${MAX_ACCESSORIES} accessory at a time</span><span class="pill">Pick up on campus</span></div>
    </section>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Search costumes…" value="${esc(ui.q)}">
      <div class="chips" id="types">${["All","Costume","Accessory"].map(t=>`<button class="chip ${ui.type===t?"on":""}" data-t="${t}">${t==="All"?"Everything":t==="Accessory"?"Accessories":"Costumes"}</button>`).join("")}</div>
      <div class="chips" id="cats">${["All",...CATEGORIES].map(c=>`<button class="chip ${ui.cat===c?"on":""}" data-c="${esc(c)}">${c==="All"?"All categories":esc(c)}</button>`).join("")}</div>
    </div>
    <div class="grid" id="grid"><div class="empty" style="grid-column:1/-1">Loading the closet…</div></div>`;
  document.getElementById("q").oninput = e => { ui.q = e.target.value; drawGrid(); };
  document.getElementById("types").onclick = e => { const b=e.target.closest("[data-t]"); if(!b) return; ui.type=b.dataset.t; browseChips(); drawGrid(); };
  document.getElementById("cats").onclick = e => { const b=e.target.closest("[data-c]"); if(!b) return; ui.cat=b.dataset.c; browseChips(); drawGrid(); };
  const [{ data, error }] = await Promise.all([sb.from("costumes").select("*").neq("status","Hidden").order("created_at",{ascending:false}), loadListers()]);
  if (error){ document.getElementById("grid").innerHTML = `<div class="msg err" style="grid-column:1/-1">Couldn't load costumes: ${esc(error.message)}</div>`; return; }
  costumesCache = data || [];
  drawGrid();
}
function browseChips(){
  document.querySelectorAll("#types .chip").forEach(b=>b.classList.toggle("on", b.dataset.t===ui.type));
  document.querySelectorAll("#cats .chip").forEach(b=>b.classList.toggle("on", b.dataset.c===ui.cat));
}
function drawGrid(){
  const g = document.getElementById("grid"); if (!g) return;
  const q = ui.q.trim().toLowerCase();
  const list = costumesCache.filter(c =>
    (ui.type==="All" || c.type===ui.type) &&
    (ui.cat==="All" || cats(c).includes(ui.cat)) &&
    (!q || [c.name,c.description,...cats(c),c.size].join(" ").toLowerCase().includes(q)));
  g.innerHTML = list.length ? list.map(c => `
    <a class="card" href="#/item/${c.id}">
      <div class="ph">${photo(c)}<span class="tag ${c.status==="Out"?"out":""}">${c.status==="Out"?"Rented out":"Available"}</span></div>
      <div class="meta"><h3>${esc(c.name)}</h3><div class="sub">${esc([c.size, ...cats(c)].filter(Boolean).join(" · "))}</div>${listedBy(c) ? `<div class="sub by">Listed by ${esc(listedBy(c))}</div>` : ""}</div>
    </a>`).join("") : `<div class="empty" style="grid-column:1/-1">${costumesCache.length ? "Nothing matches that. Try another search." : "The closet is empty right now. Check back soon!"}</div>`;
}

// ---------- ITEM ----------
async function item(id){
  loading();
  const [{ data: c, error }] = await Promise.all([sb.from("costumes").select("*").eq("id", id).maybeSingle(), loadListers()]);
  if (error || !c){ app.innerHTML = `<div class="page"><div class="msg err">That costume wasn't found.</div><a class="back" href="#/">← Back to the closet</a></div>`; return; }
  let action;
  if (c.status === "Out") action = `<div class="msg info">This one is rented out right now. Check back after it's returned.</div>`;
  else if (!session) action = `<a class="btn" href="#/login?next=item/${c.id}">Sign in to request</a><p class="note">Members pay $${PRICE}/month and can have ${MAX_COSTUMES} costumes + ${MAX_ACCESSORIES} accessory out at once.</p>`;
  else if (!isActive(profile)) action = payBox();
  else action = `
    <form id="req">
      <div class="row2">
        <div><label>Pickup date</label><input type="date" name="pickup" min="${today()}" required></div>
        <div><label>Return by</label><input type="date" name="ret" required disabled></div>
      </div>
      <p class="note" id="rnote">Pick a pickup date first. You can keep it up to ${MAX_DAYS} days.</p>
      <label>Anything we should know? (optional)</label>
      <textarea name="notes" rows="2" placeholder="Event, sizing question, pickup time…"></textarea>
      <button class="btn" style="width:100%;margin-top:14px" type="submit">Request this ${c.type==="Accessory"?"accessory":"costume"}</button>
      <p class="note">Once the team confirms, you’ll see who to text under My Rentals to set up a pickup time and place. Payment is your monthly membership, nothing extra.</p>
      <div id="rmsg"></div>
    </form>`;
  app.innerHTML = `
    <a class="back" href="#/">← Back to the closet</a>
    <div class="detail">
      <div class="ph">${photo(c)}</div>
      <div>
        <span class="pill">${esc(c.type)}</span>
        <h1>${esc(c.name)}</h1>
        <div class="kv">
          ${c.size?`<span class="pill">Size ${esc(c.size)}</span>`:""}
          ${cats(c).map(k=>`<span class="pill">${esc(k)}</span>`).join("")}
          ${c.condition?`<span class="pill">${esc(c.condition)} condition</span>`:""}
          ${listedBy(c)?`<span class="pill">Listed by ${esc(listedBy(c))}</span>`:""}
        </div>
        ${c.description?`<p class="desc">${esc(c.description)}</p>`:""}
        <div class="box"><h3>Rent it</h3>${action}</div>
      </div>
    </div>`;
  const f = document.getElementById("req");
  if (f){
    const pk = f.elements.pickup, rt = f.elements.ret, rn = document.getElementById("rnote");
    pk.onchange = () => {
      if (!pk.value){ rt.value = ""; rt.disabled = true; return; }
      const max = addDays(pk.value, MAX_DAYS);
      rt.disabled = false; rt.min = pk.value; rt.max = max;
      if (!rt.value || rt.value < pk.value || rt.value > max) rt.value = max;
      rn.textContent = `Return by ${fmt(max)} at the latest (${MAX_DAYS} days max).`;
    };
  }
  if (f) f.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(f), m = document.getElementById("rmsg"), b = f.querySelector("button");
    if (!fd.get("ret") || fd.get("ret") < fd.get("pickup")){ m.innerHTML = `<div class="msg err">Return date has to be on or after pickup.</div>`; return; }
    if (fd.get("ret") > addDays(fd.get("pickup"), MAX_DAYS)){ m.innerHTML = `<div class="msg err">You can keep it up to ${MAX_DAYS} days.</div>`; return; }
    b.disabled = true;
    const { error } = await sb.from("requests").insert({ member_id: session.user.id, costume_id: c.id, pickup_date: fd.get("pickup"), return_by: fd.get("ret"), notes: fd.get("notes") || null });
    b.disabled = false;
    if (error){ m.innerHTML = `<div class="msg err">${esc(friendly(error))}</div>`; return; }
    f.innerHTML = `<div class="msg ok">Request sent! You'll see it under My Rentals, and the team will confirm it soon.</div><a class="btn ghost" style="margin-top:12px" href="#/rentals">View my rentals</a>`;
  };
}

// ---------- MY RENTALS ----------
async function rentals(){
  if (!session) return go("login?next=rentals");
  loading();
  const { data, error } = await sb.from("requests").select("*, costumes(name, photo_url, type)").eq("member_id", session.user.id).order("created_at",{ascending:false});
  const { data: contacts } = await sb.rpc("my_rental_contacts");
  const contactFor = id => (contacts || []).find(c => c.request_id === id);
  const pickup = r => {
    if (r.status === "Pending") return `<small>Waiting for the team to confirm.</small>`;
    if (r.status !== "Confirmed") return "";
    const c = contactFor(r.id);
    if (!c || !c.phone) return `<div class="msg info" style="margin-top:8px">Confirmed! The team will reach out to set up pickup.</div>`;
    return `<div class="msg ok" style="margin-top:8px">Confirmed! Text <strong>${esc(c.name || "the team")}</strong> to set a pickup time and place.
      <a class="btn sm" style="margin-top:8px;display:flex" href="sms:${esc(digits(c.phone))}">Text ${esc(c.phone)}</a></div>`;
  };
  const open = (data||[]).filter(r => ["Pending","Confirmed"].includes(r.status));
  const cos = open.filter(r=>r.item_type==="Costume").length, acc = open.filter(r=>r.item_type==="Accessory").length;
  app.innerHTML = `
    <div class="page">
      <h1>My Rentals</h1>
      ${isActive(profile)
        ? `<div class="msg info">You have <b>${cos} of ${MAX_COSTUMES}</b> costumes and <b>${acc} of ${MAX_ACCESSORIES}</b> accessory out or pending.</div>`
        : payBox()}
      ${error ? `<div class="msg err">${esc(error.message)}</div>` : ""}
      <div class="list">${(data||[]).length ? data.map(r => `
        <div class="item">
          <div class="th">${photo(r.costumes)}</div>
          <div class="info"><b>${esc(r.costumes?.name || "Item")}</b>
            <small>${fmt(r.pickup_date)} → ${fmt(r.return_by)}</small>
            <span class="st ${esc(r.status)}">${esc(r.status)}</span>${pickup(r)}</div>
        </div>`).join("") : `<div class="empty">No rentals yet. <a href="#/">Browse the closet</a></div>`}</div>
    </div>`;
}

// ---------- AUTH ----------
function login(mode="in", next=""){
  app.innerHTML = `
    <div class="page auth">
      <h1>${mode==="in"?"Sign in":"Create your account"}</h1>
      <p class="note">${mode==="in"?"Welcome back.":"Use your UNC email. After you sign up, Venmo the team $"+PRICE+" and we'll activate your membership."}</p>
      <form id="af" class="box">
        ${mode==="up"?`<label>Your name</label><input type="text" name="name" required autocomplete="name">`:""}
        <label>Email</label><input type="email" name="email" required autocomplete="email">
        <label>Password</label><input type="password" name="pw" required minlength="6" autocomplete="${mode==="in"?"current-password":"new-password"}">
        <button class="btn" style="width:100%;margin-top:16px" type="submit">${mode==="in"?"Sign in":"Sign up"}</button>
        <div id="am"></div>
      </form>
      <p class="note" style="text-align:center">${mode==="in"?`New here? <a href="#/signup${next?"?next="+esc(next):""}">Create an account</a>`:`Already have one? <a href="#/login${next?"?next="+esc(next):""}">Sign in</a>`}</p>
    </div>`;
  const f = document.getElementById("af");
  f.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(f), m = document.getElementById("am"), b = f.querySelector("button");
    b.disabled = true;
    const res = mode==="in"
      ? await sb.auth.signInWithPassword({ email: fd.get("email"), password: fd.get("pw") })
      : await sb.auth.signUp({ email: fd.get("email"), password: fd.get("pw"), options: { data: { name: fd.get("name") } } });
    b.disabled = false;
    if (res.error){ m.innerHTML = `<div class="msg err">${esc(friendly(res.error))}</div>`; return; }
    if (mode==="up" && !res.data.session){ m.innerHTML = `<div class="msg ok">Check your email to confirm your account, then sign in.</div>`; return; }
    session = res.data.session; await loadProfile();
    go(next || "");
  };
}

// ---------- TEAM ----------
async function team(){
  if (!profile?.is_team){ app.innerHTML = `<div class="page"><div class="msg err">Team only.</div></div>`; return; }
  const t = ui.teamTab;
  app.innerHTML = `
    <div class="page">
      <h1>Team</h1>
      <div class="tabs">${[["requests","Requests"],["closet","Closet"],["add","Add item"],["members","Members"]].map(([k,l])=>`<button class="chip ${t===k?"on":""}" data-k="${k}">${l}</button>`).join("")}</div>
      <div id="tb"><div class="empty">Loading…</div></div>
    </div>`;
  app.querySelector(".tabs").onclick = e => { const b=e.target.closest("[data-k]"); if(!b) return; ui.teamTab=b.dataset.k; team(); };
  const tb = document.getElementById("tb");
  if (t==="requests") return teamRequests(tb);
  if (t==="closet") return teamCloset(tb);

async function teamRequests(tb){
  const [{ data, error }, team] = await Promise.all([
    sb.from("requests").select("*, costumes(id, name, photo_url, listed_by), profiles(name, email)").order("created_at",{ascending:false}),
    teamList()]);
  const owner = id => team.find(p => p.id === id);
  if (error){ tb.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const order = {Pending:0, Confirmed:1, Returned:2, Cancelled:3};
  const list = (data||[]).sort((a,b)=>order[a.status]-order[b.status]);
  tb.innerHTML = `<div class="list">${list.length ? list.map(r => `
    <div class="item">
      <div class="th">${photo(r.costumes)}</div>
      <div class="info"><b>${esc(r.costumes?.name || "Item")}</b>
        <small>${esc(r.profiles?.name || "")} · ${esc(r.profiles?.email || "")}</small>
        <small>Listed by: <strong>${esc(owner(r.costumes?.listed_by)?.name || "nobody yet")}</strong></small>
        <small>${fmt(r.pickup_date)} → ${fmt(r.return_by)}${r.notes?` · “${esc(r.notes)}”`:""}</small>
        <span class="st ${esc(r.status)}">${esc(r.status)}</span></div>
      <div class="acts">
        ${r.status==="Pending"?`<button class="btn sm" data-a="Confirmed" data-r="${r.id}" data-c="${r.costume_id}">Confirm</button><button class="btn sm red" data-a="Cancelled" data-r="${r.id}" data-c="${r.costume_id}">Decline</button>`:""}
        ${r.status==="Confirmed"?`<button class="btn sm navy" data-a="Returned" data-r="${r.id}" data-c="${r.costume_id}">Mark returned</button>`:""}
      </div>
    </div>`).join("") : `<div class="empty">No requests yet.</div>`}</div>`;
  tb.onclick = async e => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    b.disabled = true;
    const a = b.dataset.a;
    const { error } = await sb.from("requests").update({ status: a }).eq("id", b.dataset.r);
    if (!error && a==="Confirmed") await sb.from("costumes").update({ status: "Out" }).eq("id", b.dataset.c);
    if (!error && a==="Returned") await sb.from("costumes").update({ status: "Available" }).eq("id", b.dataset.c);
    if (error) alertMsg(tb, error); else teamRequests(tb);
  };
}

async function teamCloset(tb){
  const [{ data, error }, team] = await Promise.all([sb.from("costumes").select("*").order("created_at",{ascending:false}), teamList()]);
  if (error){ tb.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  tb.innerHTML = `<p class="note">“Listed by” is who renters text for pickup once a rental is confirmed.</p><div class="list">${(data||[]).length ? data.map(c => `
    <div class="item">
      <div class="th">${photo(c)}</div>
      <div class="info"><b>${esc(c.name)}</b><small>${esc([c.type,c.size].filter(Boolean).join(" · "))}</small>
        <div class="chips" style="flex-wrap:wrap;padding-top:6px">${CATEGORIES.map(k=>`<button class="chip mini ${cats(c).includes(k)?"on":""}" data-cat="${esc(k)}" data-cid="${c.id}">${esc(k)}</button>`).join("")}</div></div>
      <div class="acts">
        <select data-o="${c.id}" style="width:auto;padding:8px 12px" title="Listed by"><option value="">Listed by…</option>${team.map(p=>`<option value="${p.id}" ${c.listed_by===p.id?"selected":""}>${esc(p.name || p.email)}</option>`).join("")}</select>
        <select data-s="${c.id}" style="width:auto;padding:8px 12px">${["Available","Out","Hidden"].map(s=>`<option ${c.status===s?"selected":""}>${s}</option>`).join("")}</select>
        <button class="btn sm red" data-del="${c.id}">Delete</button>
      </div>
    </div>`).join("") : `<div class="empty">No items yet. Use “Add item”.</div>`}</div>`;
  tb.onchange = async e => {
    const o = e.target.closest("[data-o]");
    if (o){ listers = null; const { error } = await sb.from("costumes").update({ listed_by: o.value || null }).eq("id", o.dataset.o); if (error) alertMsg(tb, error); return; }
    const s = e.target.closest("[data-s]"); if (!s) return;
    const { error } = await sb.from("costumes").update({ status: s.value }).eq("id", s.dataset.s);
    if (error) alertMsg(tb, error);
  };
  tb.onclick = async e => {
    const k = e.target.closest("[data-cat]");
    if (k){
      const item = (data||[]).find(x => String(x.id) === k.dataset.cid);
      const cur = cats(item), name = k.dataset.cat;
      const next = cur.includes(name) ? cur.filter(x => x !== name) : [...cur, name];
      k.disabled = true;
      const { error } = await sb.from("costumes").update({ categories: next }).eq("id", item.id);
      k.disabled = false;
      if (error) return alertMsg(tb, error);
      item.categories = next; k.classList.toggle("on", next.includes(name));
      return;
    }
    const d = e.target.closest("[data-del]"); if (!d) return;
    if (d.dataset.confirm !== "1"){ d.dataset.confirm = "1"; d.textContent = "Tap again to delete"; return; }
    const { error } = await sb.from("costumes").delete().eq("id", d.dataset.del);
    if (error) alertMsg(tb, error); else teamCloset(tb);
  };
}

function teamAdd(tb){
  tb.innerHTML = `
    <form id="add" class="box" style="max-width:560px">
      <label>Photo</label><input type="file" name="photo" accept="image/*">
      <label>Name</label><input type="text" name="name" required placeholder="70s Disco Jumpsuit">
      <div class="row2">
        <div><label>Type</label><select name="type"><option>Costume</option><option>Accessory</option></select></div>
        <div><label>Size</label><select name="size">${SIZES.map(s=>`<option>${s}</option>`).join("")}</select></div>
      </div>
      <label>Condition</label><select name="condition"><option>New</option><option selected>Good</option><option>Fair</option></select>
      <label>Categories (pick as many as fit)</label>
      <div class="chips" id="addcats" style="flex-wrap:wrap">${CATEGORIES.map(c=>`<button type="button" class="chip" data-pick="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <label>Description</label><textarea name="description" rows="3" placeholder="What's included, how it fits…"></textarea>
      <button class="btn" style="width:100%;margin-top:16px" type="submit">Add to the closet</button>
      <div id="addm"></div>
    </form>`;
  const f = document.getElementById("add");
  document.getElementById("addcats").onclick = e => { const b = e.target.closest("[data-pick]"); if (b) b.classList.toggle("on"); };
  f.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(f), m = document.getElementById("addm"), b = f.querySelector("button");
    b.disabled = true; b.textContent = "Saving…";
    try {
      let photo_url = null;
      const file = fd.get("photo");
      if (file && file.size){
        const blob = await shrink(file);
        const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
        const up = await sb.storage.from("costume-photos").upload(path, blob, { contentType: "image/jpeg" });
        if (up.error) throw up.error;
        photo_url = sb.storage.from("costume-photos").getPublicUrl(path).data.publicUrl;
      }
      const { error } = await sb.from("costumes").insert({
        name: fd.get("name"), type: fd.get("type"), size: fd.get("size"),
        categories: [...f.querySelectorAll("#addcats .chip.on")].map(b => b.dataset.pick),
        condition: fd.get("condition"), description: fd.get("description") || null, photo_url, listed_by: session.user.id });
      if (error) throw error;
      f.reset(); f.querySelectorAll("#addcats .chip.on").forEach(b => b.classList.remove("on")); m.innerHTML = `<div class="msg ok">Added! Add another or check the Closet tab.</div>`;
    } catch (err){ m.innerHTML = `<div class="msg err">${esc(friendly(err))}</div>`; }
    b.disabled = false; b.textContent = "Add to the closet";
  };
}

    if (error){ c.checked = !c.checked; alertMsg(tb, error); return; }

function alertMsg(el, err){ el.insertAdjacentHTML("afterbegin", `<div class="msg err">${esc(friendly(err))}</div>`); }

// shrink photos in the browser so storage stays free (max 1200px, JPEG ~80%)
function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1200 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? res(b) : rej(new Error("Couldn't read that photo.")), "image/jpeg", 0.8);
    };
    img.onerror = () => rej(new Error("Couldn't read that photo. Try a JPG or PNG."));
    img.src = url;
  });
}

// ---------- ROUTER ----------
function go(path){ location.hash = "#/" + path; }
async function route(){
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const next = new URLSearchParams(qs || "").get("next") || "";
  const [p, id] = path.split("/");
  if (p === "out"){ await sb.auth.signOut(); session = null; profile = null; return go(""); }
  const name = p === "item" ? "browse" : p === "signup" ? "login" : (p || "browse");
  drawNav(name);
  window.scrollTo(0, 0);
  if (p === "item") return item(id);
  if (p === "rentals") return rentals();
  if (p === "team") return team();
  if (p === "login") return login("in", next);
  if (p === "signup") return login("up", next);
  return browse();
}

window.addEventListener("hashchange", route);
const { data: { session: s0 } } = await sb.auth.getSession();
session = s0; await loadProfile();
sb.auth.onAuthStateChange((_e, s) => {
  const changed = (s?.user?.id || null) !== (session?.user?.id || null);
  session = s;
  if (changed) setTimeout(async () => { await loadProfile(); route(); }, 0);
});
route();
